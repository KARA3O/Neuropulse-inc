<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{site.url}}{{page.path}}">
<meta name="theme-color" content="#0A0C10">
<meta name="color-scheme" content="dark light">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{site.url}}{{page.path}}">
<meta property="og:image" content="{{site.url}}/assets/brand/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@neuropulseinc">

<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon-180.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preload" href="/assets/fonts/Outfit-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/DMSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset:/css/site.css}}">
<script type="module" src="{{asset:/js/main.js}}"></script>
{{analytics}}
