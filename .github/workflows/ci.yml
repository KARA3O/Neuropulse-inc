# Continuous integration: build the site and run the unit tests on every push and pull request.
#
# This workflow does NOT deploy. Cloudflare Workers Builds is connected to this repository and
# deploys every push to main (Cloudflare dashboard → Workers & Pages → neuropulse-inc → Settings →
# Builds). Database migrations are not applied here either: see docs/DEPLOYMENT.md →
# "Automatic deploys from GitHub".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
